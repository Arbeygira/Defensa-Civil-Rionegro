<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>INFORMES AMBIENTALES</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <form action="insertar.php" class="form-register" method="post" enctype="multipart/form-data">
        <h1 class="form__title">INFORMES AMBIENTALES</h1>
        <div class="container--flex">
            <label for="" class="form__input">Nombre de quien registra</label>
            <input type="text" class="form__input" name="nombre" required>
        </div>
        <div class="container--flex">
            <label for="" class="form__input">Nombre de la actividad</label>
            <input type="text" class="form__input" name="actividad" required>
        </div>
        <div class="container--flex">
            <label for="" class="form__input">Cantidad de lideres voluntarios participantes</label>
            <input type="text" class="form__input" name="lideres" required>
        </div>
        <div class="container--flex">
            <label for="" class="form__input">Fecha</label>
            <input type="date" class="form__input" name="fecha" required>
        </div>
        <div class="container--flex">
            <label for="" class="form__input">Hora de inicio</label>
            <input type="time" class="form__input" name="hora1" required>
        </div>
        <div class="container--flex">
            <label for="" class="form__input">Hora de Finalizacion</label>
            <input type="time" class="form__input" name="hora2" required>
        </div>
            <input type="file" name="archivo" class="form__file" required>
            <input type="submit" class="form__submit">
    </form>
</body>
</html>
